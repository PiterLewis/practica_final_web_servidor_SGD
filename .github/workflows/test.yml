name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Validar schema Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://x:y@localhost:5432/x
          DIRECT_URL: postgresql://x:y@localhost:5432/x

      - name: Ejecutar tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: secreto_de_pruebas_min_32_caracteres_xxx
          JWT_REFRESH_SECRET: refresh_de_pruebas_min_32_caracteres_xxx

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validar build de Docker
        run: docker build -t bildyapp-api .
